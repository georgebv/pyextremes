name: Test

on:
  workflow_call:
  pull_request:
    branches:
      - master

jobs:
  test-linux:
    name: Linux, Python ${{ matrix.python-version }}, pandas ${{ matrix.pandas-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        pandas-version: ["1.5.3", "2.3.3", "3.0.5"]
        exclude:
          - { python-version: "3.12", pandas-version: "1.5.3" }
          - { python-version: "3.13", pandas-version: "1.5.3" }
          - { python-version: "3.9",  pandas-version: "3.0.5" }
          - { python-version: "3.10", pandas-version: "3.0.5" }
        include:
          - { pandas-version: "1.5.3", numpy-spec: "numpy<2" }
          - { pandas-version: "2.3.3", numpy-spec: "numpy>=2" }
          - { pandas-version: "3.0.5", numpy-spec: "numpy>=2" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --all-groups
      - name: Install the target pandas/numpy pair
        run: uv pip install "pandas==${{ matrix.pandas-version }}" "${{ matrix.numpy-spec }}"
      - name: Run tests and generate coverage report
        run: uv run --no-sync pytest
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: success() && matrix.python-version == '3.13' && matrix.pandas-version == '3.0.5'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true
  test-windows:
    name: Windows, Python ${{ matrix.python-version }}, pandas ${{ matrix.pandas-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        pandas-version: ["1.5.3", "2.3.3", "3.0.5"]
        exclude:
          - { python-version: "3.12", pandas-version: "1.5.3" }
          - { python-version: "3.13", pandas-version: "1.5.3" }
          - { python-version: "3.9",  pandas-version: "3.0.5" }
          - { python-version: "3.10", pandas-version: "3.0.5" }
        include:
          - { pandas-version: "1.5.3", numpy-spec: "numpy<2" }
          - { pandas-version: "2.3.3", numpy-spec: "numpy>=2" }
          - { pandas-version: "3.0.5", numpy-spec: "numpy>=2" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --all-groups
      - name: Install the target pandas/numpy pair
        run: uv pip install "pandas==${{ matrix.pandas-version }}" "${{ matrix.numpy-spec }}"
      - name: Run tests
        run: uv run --no-sync pytest
  tests-passed:
    # Single, stable check name to require in branch rulesets (matrix job names are dynamic).
    # `always()` ensures this job reports failure, rather than "skipped", when a matrix job fails.
    name: All tests passed
    if: always()
    needs: [test-linux, test-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "test-linux: ${{ needs.test-linux.result }}"
          echo "test-windows: ${{ needs.test-windows.result }}"
          exit 1
